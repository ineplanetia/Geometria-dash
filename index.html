<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geometry Dash Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 400px;
        }
        canvas {
            background: linear-gradient(to bottom, #1a0033, #4d0099);
            width: 100%;
            height: 100%;
            display: block;
            border-bottom: 4px solid #00ffff;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }
        #restartBtn {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 0 15px #ff0055;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        Очки: <span id="score">0</span> | Рекорд: <span id="highScore">0</span>
    </div>
    <button id="restartBtn" onclick="resetGame()">ИГРАТЬ СНОВА</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const restartBtn = document.getElementById('restartBtn');

    // Размеры холста
    canvas.width = 800;
    canvas.height = 400;

    const floorY = 320;
    let score = 0;
    let highScore = localStorage.getItem('gd_highscore') || 0;
    highScoreEl.innerText = highScore;

    let gameOver = false;
    let gameSpeed = 6;
    let frameCount = 0;

    // Кубик
    const player = {
        x: 100,
        y: floorY - 40,
        size: 40,
        vy: 0,
        gravity: 0.8,
        jumpPower: -13,
        isGrounded: false,
        angle: 0
    };

    // Массив препятствий
    let obstacles = [];

    function jump() {
        if (player.isGrounded && !gameOver) {
            player.vy = player.jumpPower;
            player.isGrounded = false;
        }
    }

    // Управление для мобилок и ПК
    window.addEventListener('touchstart', (e) => {
        if (e.target !== restartBtn) jump();
    });
    window.addEventListener('mousedown', (e) => {
        if (e.target !== restartBtn) jump();
    });
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') jump();
    });

    function createObstacle() {
        const type = Math.random() > 0.5 ? 'spike' : 'block';
        obstacles.push({
            x: canvas.width + 50,
            y: type === 'spike' ? floorY - 35 : floorY - 40,
            width: type === 'spike' ? 35 : 40,
            height: type === 'spike' ? 35 : 40,
            type: type
        });
    }

    function update() {
        if (gameOver) return;

        frameCount++;
        score = Math.floor(frameCount / 5);
        scoreEl.innerText = score;

        // Постепенный разгон
        if (frameCount % 500 === 0) gameSpeed += 0.5;

        // Физика игрока
        player.vy += player.gravity;
        player.y += player.vy;

        if (player.y >= floorY - player.size) {
            player.y = floorY - player.size;
            player.vy = 0;
            player.isGrounded = true;
            player.angle = Math.round(player.angle / 90) * 90; // Выравниваем при посадке
        } else {
            player.angle += 8; // Вращение в воздухе
        }

        // Спавн препятствий
        if (frameCount % Math.max(60, 120 - Math.floor(gameSpeed * 5)) === 0) {
            createObstacle();
        }

        // Движение препятствий и коллизии
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= gameSpeed;

            // Проверка столкновения
            if (
                player.x < obs.x + obs.width &&
                player.x + player.size > obs.x &&
                player.y < obs.y + obs.height &&
                player.y + player.size > obs.y
            ) {
                endGame();
            }

            // Удаление ушедших за экран
            if (obs.x + obs.width < 0) {
                obstacles.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Земля
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(0, floorY, canvas.width, 5);
        ctx.fillStyle = '#110022';
        ctx.fillRect(0, floorY + 5, canvas.width, canvas.height - floorY);

        // Игрок (Куб)
        ctx.save();
        ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
        ctx.rotate((player.angle * Math.PI) / 180);
        ctx.fillStyle = '#00ffcc';
        ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);
        
        // Глаз кубика
        ctx.fillStyle = '#fff';
        ctx.fillRect(-5, -10, 15, 15);
        ctx.restore();

        // Препятствия
        obstacles.forEach(obs => {
            if (obs.type === 'spike') {
                // Шип
                ctx.fillStyle = '#ff0055';
                ctx.beginPath();
                ctx.moveTo(obs.x, obs.y + obs.height);
                ctx.lineTo(obs.x + obs.width / 2, obs.y);
                ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.stroke();
            } else {
                // Блок
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            }
        });
    }

    function endGame() {
        gameOver = true;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('gd_highscore', highScore);
            highScoreEl.innerText = highScore;
        }
        restartBtn.style.display = 'block';
    }

    function resetGame() {
        obstacles = [];
        score = 0;
        frameCount = 0;
        gameSpeed = 6;
        player.y = floorY - player.size;
        player.vy = 0;
        player.angle = 0;
        gameOver = false;
        restartBtn.style.display = 'none';
        loop();
    }

    function loop() {
        update();
        draw();
        if (!gameOver) {
            requestAnimationFrame(loop);
        }
    }

    loop();
</script>
</body>
</html>
